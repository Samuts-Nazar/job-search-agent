# Copy this file to config.yaml (gitignored) and edit. See README for details.

mode: wide  # wide | selective

thresholds:
  # Placeholder defaults -- tune after the first few real runs (see job stats).
  # fit_score_min / maybe_score_min define the apply/maybe/skip bands a
  # posting's fit_score is sorted into (verdict is derived in code from
  # fit_score, not model output -- see job_agent/scoring.py:derive_verdict).
  # >= fit_score_min -> apply, >= maybe_score_min -> maybe, else skip.
  wide:
    fit_score_min: 40
    maybe_score_min: 20
    salary_floor_usd: null
    seniority_strict: false
  selective:
    fit_score_min: 70
    maybe_score_min: 40
    salary_floor_usd: null
    seniority_strict: true

models:
  # Model IDs are OpenRouter slugs, verified live against
  # https://openrouter.ai/api/v1/models on 2026-09-16 -- re-check before relying
  # on them, IDs and availability change often.
  #
  # Each entry may be a plain id string (default reasoning: "none") or
  # {id, reasoning}. reasoning is one of none/minimal/low/medium/high/omit
  # -- "omit" sends no `reasoning` param at all, which some endpoints
  # require (verified live 2026-09-19: z-ai/glm-5.3-flash 400s with
  # "Reasoning is mandatory for this endpoint and cannot be disabled." if
  # any effort is sent, explicit or "none"). The client also auto-detects
  # this per-model at runtime and retries once without the param -- the
  # explicit `omit` here just skips that wasted first attempt.
  bulk: "deepseek/deepseek-v4.1-flash"   # cheap, high-volume scoring (job_agent.scoring)
  quality: "anthropic/claude-haiku-4.5"  # CV edits, cover letters, outreach drafts (Phase 2+)
  fallbacks:
    bulk:
      - id: "z-ai/glm-5.3-flash"
        reasoning: omit
      - "qwen/qwen3.8-flash"
    quality: ["z-ai/glm-5.3"]
  eval_candidates:      # models compared by `job eval`; see PROJECT.md §7 / README
    - id: "z-ai/glm-5.3-flash"
      reasoning: omit
    - "deepseek/deepseek-v4.1-flash"
    - "qwen/qwen3.8-flash"
    - "google/gemma-4-26b-a4b-it"
    # The :free variant of gemma-4-26b-a4b-it is NOT usable for this
    # pipeline: verified live 2026-09-19, it 429'd on every single request
    # (100% failure) with `limit_source: upstream_provider_shared_pool` --
    # Google AI Studio's shared free-tier capacity for this model is
    # congested account-wide across ALL OpenRouter users, independent of
    # our own request pace (we were already throttled to <=1 req/3.1s).
    # Only the paid variant above is a real eval candidate.

# Every source below has apply_policy: "manual" or "automated" (PROJECT.md
# §5.7). "manual" means the package flow always produces a manual-apply
# bundle (CV + message + direct apply link + checklist, with a "mark as
# submitted" button) and never attempts automated form-filling for that
# source, regardless of what gets built later. djinni and dou default to
# "manual" as a permanent policy decision, not a placeholder: DOU's own
# rules explicitly ban automated-application tools (verified live
# 2026-09-22, dou.ua/applications-rules/), and Djinni's own policy on this
# couldn't be verified either way. Automated ATS filling (once built) only
# ever applies to "automated"-policy sources.
sources:
  djinni:
    enabled: true
    categories: ["QA", "QA Automation", "Support", "Sysadmin", "ML AI", "Python"]
    apply_policy: manual
  dou:
    enabled: true
    # DOU's `category` param (verified live 2026-09-16) has no separate "QA
    # Automation" -- its "QA" category covers both manual and automation.
    categories: ["QA", "Support", "SysAdmin", "AI/ML", "Python"]
    apply_policy: manual
  remoteok:
    enabled: true
    # remoteok.com/api's `?tag=` query param does NOT filter server-side
    # (verified live 2026-09-16) -- these tags are matched client-side against
    # each posting's `tags` array in job_agent/sources/remoteok.py.
    # IMPORTANT: match RemoteOK's own tag vocabulary exactly (verified live
    # 2026-09-22 against every tag actually present in /api) -- the
    # original list here ("qa", "support", "sysadmin", "machine-learning")
    # matched NONE of RemoteOK's real tags, so those 4 categories were
    # silently collecting zero RemoteOK postings the whole time. "python"
    # was the only one that happened to match.
    tags: ["quality assurance", "testing", "customer support", "sys admin", "ai", "data science", "python"]
  wwr:
    enabled: true
    # WWR only has category RSS feeds for 2 of our 6 targets (verified live
    # 2026-09-16); QA, QA Automation and ML AI have no WWR category, and no
    # sound proxy category either -- left uncovered. Python has no direct
    # category, but "back-end"/"full-stack programming" are a reasonable
    # proxy: keyword_categories fetches those and keeps only items whose
    # title matches (see job_agent/sources/wwr.py, verified live 2026-09-22
    # that WWR's own ?term= search is NOT filtered server-side either).
    categories: ["remote-devops-sysadmin-jobs", "remote-customer-support-jobs"]
    keyword_categories:
      remote-back-end-programming-jobs: ["python"]
      remote-full-stack-programming-jobs: ["python"]
  linkedin:
    enabled: true
    keywords: ["QA", "QA Automation", "Support", "Sysadmin", "Machine Learning", "Python"]
    # 50 = top of PROJECT.md's stated ~25-50/run safety band (line 85), not a
    # technical ceiling -- verified live 2026-09-23 that the guest endpoint
    # returns exactly what's requested per keyword with no throttling
    # (job_agent/sources/linkedin.py's module docstring has the details).
    # collect_linkedin splits this across keywords without discarding a
    # remainder, so the real per-run count lands close to this number.
    results_wanted: 50
  nofluffjobs:
    enabled: false        # no public API; implement last if feasible (Phase 3)

categories: ["QA", "QA Automation", "Support", "Sysadmin", "ML AI", "Python"]

budget:
  monthly_usd: 10

telegram:
  # Decoupled from thresholds.*.fit_score_min above: min_score only
  # controls which scored postings get a card sent to Telegram, independent
  # of the apply/maybe/skip thresholds used for analysis (job stats, job
  # export, job analyze --rescore). `job --no-telegram` skips sending
  # entirely regardless of this value.
  min_score: 40
