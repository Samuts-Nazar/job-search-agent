[project]
name = "job-agent"
version = "0.1.0"
description = "Local, CLI-driven job search agent: collects, dedupes, scores, and packages job applications with human approval via Telegram."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "feedparser>=6.0",
    "python-jobspy>=1.1",
    "aiogram>=3.15",
    "pyyaml>=6.0",
    "tenacity>=9.0",
    "email-validator>=2.3.0",
]

[project.scripts]
job = "job_agent.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_agent"]
