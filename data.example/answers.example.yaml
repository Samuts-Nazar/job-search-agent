# Example answer bank for application forms (knockout questions, fixed fields).
# Copy the real one to data/answers.yaml (gitignored).
#
# Phase 3 only reads from this file for knockout questions -- it never
# generates these answers. If a required answer is missing, the pipeline
# stops and asks in Telegram instead of guessing.
#
# `example: true` makes `job` and `job check-data` refuse to run against
# this file. Set it to `false` (or delete the line) in your real copy.

example: true

work_authorization:
  eu: "requires_sponsorship"
  us: "requires_sponsorship"
  uk: "requires_sponsorship"
  ukraine: "authorized"
  # Optional: country-code -> free-text status, for countries the
  # eu/us/uk/ukraine buckets above don't cover.
  per_country: {}

relocation:
  willing: false
  notes: "Open to fully remote roles only."

notice_period_days: 30

salary_expectation:
  currency: "USD"
  monthly_min: 2500
  monthly_max: 3500
  monthly_target: 3000  # optional: one preferred figure within the range

timezone: "UTC+2"

# Everything below is optional -- fill in only what your target
# applications actually ask about.
work_format:
  remote: true
  hybrid: false
  onsite: false
  onsite_salary_floor: null

availability:
  night_shifts: false
  weekends: false
  shift_notes: null

employment_types:
  - "employment_contract"

test_task:
  willing: true
  max_hours: null

languages:
  - name: "English"
    cefr: "C1"
  - name: "Ukrainian"
    cefr: "native"

links:
  linkedin: "https://linkedin.com/in/jane-example"
  github: "https://github.com/jane-example"
  portfolio: null

years_of_experience:
  qa_automation: 3
  manual_qa: 1
  ai_automation: 0
  ml_ai: 0
  general: 3
