# Example fact registry. Copy the real one to data/facts.yaml (gitignored).
#
# This is the single source of truth for everything the agent may write about
# the candidate. Scoring, CV tailoring, and cover letters may only reference
# facts listed here -- nothing is ever invented.
#
# `example: true` makes `job` and `job check-data` refuse to run against
# this file. Set it to `false` (or delete the line) in your real copy.

example: true

candidate:
  name: "Jane Example"
  email: "jane.example@example.com"
  phone: "+1 555 0100"
  city: "Kyiv"
  country: "Ukraine"
  timezone: "UTC+2"
  links:
    linkedin: "https://linkedin.com/in/jane-example"
    github: "https://github.com/jane-example"

# Track taxonomy fixed 2026-09-22 (PROJECT.md §8.3): manual_qa, qa_automation,
# ai_automation, ml_ai. project_order is this track's fixed CV project
# selection/order (§8.3), as project ids below -- lives here (not hardcoded
# in cv/content.py) so each fork's own facts.yaml can define its own.
# growth_projects are appended only when the posting mentions automation or
# growth into it (§8.3's manual_qa rule; generic to any track, not just that
# one).
cv_tracks:
  - id: qa_automation
    title: "QA Automation Engineer"
    project_order: [example_project_1]
  - id: manual_qa
    title: "Manual QA Engineer"
    project_order: []
    growth_projects: [example_project_1]
  - id: ai_automation
    title: "AI Automation Engineer"
    project_order: [example_project_1]
  - id: ml_ai
    title: "ML/AI Engineer"
    project_order: []

skills:
  - name: "Python"
    tracks: [qa_automation, ai_automation, ml_ai]
    category: "Programming & Tools"
  - name: "Playwright"
    tracks: [qa_automation]
    category: "QA & Testing"
  - name: "pytest"
    tracks: [qa_automation, ai_automation]
    category: "QA & Testing"
  - name: "Manual testing"
    tracks: [manual_qa]
    category: "QA & Testing"
  - name: "SQL"
    tracks: [qa_automation, manual_qa, ai_automation, ml_ai]
    category: "Databases"

projects:
  - id: example_project_1
    name: "Example Test Automation Framework"
    tracks: [qa_automation, manual_qa]
    summary: "Built a Playwright + pytest framework for an e-commerce checkout flow."
    metrics:
      - "Reduced regression run time from 4h to 40m"
    tools: ["Python", "Playwright", "pytest", "GitHub Actions"]
    dates: "2024-01 to 2024-11"

experience:
  - id: example_job_1
    employer: "Example Corp"
    title: "QA Automation Engineer"
    tracks: [qa_automation, ai_automation]
    dates: "2023-02 to present"
    bullets:
      - "Automated end-to-end tests for the checkout flow, cutting regression time from 4h to 40m."
      - "Maintained a shared pytest fixture library used across three product teams."

education:
  - institution: "Example State University"
    degree: "B.Sc. Computer Science"
    dates: "2018 to 2022"

languages:
  - name: "English"
    cefr: "C1"
  - name: "Ukrainian"
    cefr: "native"
