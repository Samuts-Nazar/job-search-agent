name: pipeline

# Daily scheduled run, plus manual/telegram-poll-triggered dispatch. See
# the GitHub Actions deployment plan (docs/deployment.md) for the full
# design: personal data lives only in the private repo named by
# DATA_REPO, never in this (public) repo's checkout, logs, or artifacts.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

# Shared with telegram-poll.yml: both read-modify-write the same private
# repo and the same jobs.db release asset, which can't be merged as a
# binary file. Queue rather than run concurrently; never cancel a run
# that's already writing.
concurrency:
  group: data-repo-writer
  cancel-in-progress: false

permissions:
  contents: read

env:
  JOB_CI: "1"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout private data repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.DATA_REPO }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-repo

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Download jobs.db
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          uv run job db-pull --repo "${{ secrets.DATA_REPO }}" --db data-repo/data/jobs.db

      - name: Run pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          uv run job --no-poll \
            --config data-repo/config.yaml \
            --db data-repo/data/jobs.db \
            --facts data-repo/data/facts.yaml \
            --answers data-repo/data/answers.yaml

      - name: Upload jobs.db
        if: always()
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          uv run job db-push --repo "${{ secrets.DATA_REPO }}" --db data-repo/data/jobs.db

      - name: Push any changed tracked files (config/output, if touched)
        if: always()
        run: |
          git config -C data-repo user.name "job-search-agent bot"
          git config -C data-repo user.email "actions@users.noreply.github.com"
          scripts/safe_push.sh data-repo "pipeline run $(date -u +%FT%TZ)"

      - name: Ping healthcheck
        if: success() && env.HEALTHCHECK_URL != ''
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: curl -fsS -m 10 --retry 3 "$HEALTHCHECK_URL" || true
