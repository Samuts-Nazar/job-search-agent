name: keepalive

# GitHub disables a public repo's *scheduled* workflow triggers after 60
# days with no new commits to that repo -- only a real push resets the
# clock, not a workflow run. Since every real commit this deployment
# produces goes to the *private* data repo, this repo (the public one)
# would otherwise see zero activity forever. Monthly is a wide margin
# inside the 60-day window. See docs/deployment.md, amendment 2.

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record a timestamp (no personal content)
        run: |
          mkdir -p .github
          echo "$(date -u +%FT%TZ)" >> .github/KEEPALIVE
          git config user.name "job-search-agent bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/KEEPALIVE
          git commit -m "keepalive $(date -u +%FT%TZ)"
          git push
